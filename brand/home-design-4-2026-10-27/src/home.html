<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Today's panchang and your sky — Astro River</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="home-base.css">
<script src="shared.js"></script>
<script src="data.js"></script>
<script>
  document.documentElement.dataset.theme = THEME;
  document.documentElement.dataset.tod = TOD;
  if (Q.get('seal') === 'warm') addEventListener('DOMContentLoaded', () => document.querySelectorAll('img[src="img/seal.png"]').forEach(i => i.src = 'img/seal-warm-maroon.png'));
  if (Q.get('full')) document.documentElement.classList.add('full');
</script>
<style>
/* ---------- Round 4 additions. Round 3.1 tokens only; no new colours. ---------- */
.idline{text-align:center;font:500 12px/1.45 "Inter";color:var(--text-muted);margin:-6px 8px 12px}
.idline a{padding:12px 0;margin:-12px 0}
.times a,.tile{display:block}
/* your sky */
.sky{padding:16px 16px 6px}
.sky .lead{font:600 22px/1.15 "Cormorant";color:var(--heading)}
.sky p{font:500 14px/1.5 "Inter";color:var(--text-muted);margin-top:6px}
.sky .row{margin:14px 0 10px}
.ghost{margin:4px 0 0;border:1.5px dashed var(--line);border-radius:16px;padding:12px 14px;position:relative}
.ghost .tag{position:absolute;right:10px;top:-11px}
.ghost .gl{opacity:.62}
.skyrows>a,.skyrows>div{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.skyrows>*:last-child{border:0}
.skyrows .k{flex:none;width:86px;font:700 11px/1.35 "Inter";letter-spacing:.1em;text-transform:uppercase;color:var(--label);padding-top:3px}
.skyrows b{display:block;font:600 19px/1.2 "Cormorant";color:var(--heading)}
.skyrows span{display:block;font:500 13px/1.45 "Inter";color:var(--text-muted);margin-top:2px}
.ghost .skyrows>*{padding:7px 0}.ghost .skyrows b{font-size:16px}.ghost .skyrows .k{width:74px}
.flag{display:flex;gap:10px;align-items:center;min-height:44px;margin:4px 0 10px;padding:8px 12px;border-radius:14px;background:var(--bad-bg);color:var(--bad);font:600 13.5px/1.35 "Inter"}
.flag:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--bad);flex:none}
/* planets */
.planets{display:flex;gap:8px;overflow:hidden;padding:0 20px}
.gr{flex:none;min-width:76px;min-height:58px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 8px}
.gr b{display:block;font:700 12px/1.2 "Inter";color:var(--text)}
.gr span{display:block;font:600 16px/1.2 "Cormorant";color:var(--accent);margin-top:3px;white-space:nowrap}
.gr i{font:800 11px/1 "Inter";font-style:normal;color:var(--bad);margin-left:3px}
/* remedy */
.rem .top2{display:flex;gap:14px;align-items:center}
.rem .pic{width:92px;height:112px;border-radius:16px;overflow:hidden;flex:none}
.rem h3{font:600 25px/1.1 "Cormorant";color:var(--heading)}
.rem .prog{font:600 13px/1.3 "Inter";color:var(--text-muted);margin-top:6px}
.acts2{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.act{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.tick{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;position:relative;margin-top:1px}
.tick:after{content:"";position:absolute;inset:-8px}
.tick.on{background:var(--good);border-color:var(--good)}
.tick.on svg{width:14px;height:14px;fill:none;stroke:var(--good-bg);stroke-width:3}
.act b{display:block;font:600 15px/1.35 "Inter";color:var(--text)}.act b .dev,.act b{word-break:normal}
.act span.s{display:block;font:500 12.5px/1.4 "Inter";color:var(--text-muted);margin-top:2px}
.act.done b{color:var(--text-muted)}
.act .player{margin-top:10px;box-shadow:none;background:var(--surface-2)}
.bridge{display:flex;align-items:center;min-height:44px;margin-top:12px;font:600 14px/1.4 "Inter";color:var(--accent)}
.bridge em{font-style:normal;color:var(--text);font-weight:500}
.tmr{margin-top:6px;font:500 13px/1.45 "Inter";color:var(--text-muted)}
/* signs: your Moon sign */
.signs span.mine{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}.signs span.mine i{color:var(--on-primary)}
.signs span.now{border:1.5px solid var(--gold)}
.signs span small{display:block;font:700 9.5px/1.2 "Inter";letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
/* tomorrow at 6 am */
.wa{padding:18px;display:flex;gap:16px;align-items:center;background:var(--tint-saffron);box-shadow:none;border:1px solid var(--line)}
.wa .pic{width:84px;height:104px;border-radius:14px;overflow:hidden;flex:none}
.wa h3{font:600 24px/1.1 "Cormorant";color:var(--heading)}
.wa p{font:500 13.5px/1.45 "Inter";color:var(--text-muted);margin:6px 0 10px}
.wa .ig{font:600 13px/1 "Inter";color:var(--accent);padding:15px 4px;margin:-15px 0}
/* pujas */
.pc{width:262px;flex:none}
.pc .pic{height:160px;position:relative}
.pc .pic .tag{position:absolute;left:10px;top:10px}
.pc .body{padding:13px 14px 15px}
.pc b{display:block;font:600 22px/1.1 "Cormorant";color:var(--heading)}
.pc span.s{display:block;font:500 12.5px/1.45 "Inter";color:var(--text-muted);margin:6px 0 12px}
.pc.all{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:20px;background:var(--tint-gold);box-shadow:none;border:1px solid var(--gold)}
.photonote{display:flex;gap:10px;align-items:center;margin-top:14px;font:500 13px/1.45 "Inter";color:var(--text-muted)}
.photonote:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);flex:none}
.tag.photo{background:var(--glass);color:var(--on-photo);border:1px solid var(--glass-line);backdrop-filter:blur(6px)}
.tag.photo{background:var(--scrim-top)}
/* ask */
.ask2{padding:16px 16px 16px}
.ask2 .top2{display:flex;gap:14px;align-items:center}
.ask2 .pic{width:84px;height:84px;border-radius:16px;overflow:hidden;flex:none}
.ask2 b.t{font:700 17px/1.2 "Inter";display:block}
.ask2 p{font:500 13px/1.45 "Inter";color:var(--text-muted);margin:12px 0 12px}
.live{display:inline-block;font:700 10.5px/1 "Inter";letter-spacing:.06em;color:var(--text-muted);margin:12px 0 0}
.ai>a{flex:1;display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:16px;padding:10px;box-shadow:var(--shadow);min-width:0}
.ai img{flex:none}
.ai .s{white-space:normal}
/* how we work */
.stats{font:600 14px/1.5 "Inter";color:var(--gold-text);margin:-6px 0 14px}
.how .pic{position:relative}
.how .pic .tag{position:absolute;left:12px;bottom:12px}
/* help + footer */
.help{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:34px 20px 0;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.help span{font:500 13.5px/1.4 "Inter";color:var(--text-muted)}
.sitefoot{margin-top:28px;padding:26px 20px 30px;background:var(--surface-2);font:500 12.5px/1.6 "Inter";color:var(--text-muted)}
.sitefoot .brand{font-size:13px}
.sitefoot .tagl{margin-top:8px}
.sitefoot .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px;margin-top:18px}
.sitefoot h4{font:700 11px/1 "Inter";letter-spacing:.14em;color:var(--label);margin-bottom:8px}
.sitefoot .cols a{display:block;color:var(--text);padding:3px 0}
.sitefoot .legal{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
/* phone almanac: the painting sits beside the tithi so the tiles and Your sky reach the first screen */
.alm{padding:14px 16px 16px}.alm .date .n{font-size:70px}.alm .greet{font-size:21px}
.alm .date{margin:4px 0 2px}.alm .city{margin:4px 0 10px}
.tr2{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:14px;align-items:center;margin-top:12px}
.tr2 .tithi{text-align:left;margin:0}
.tr2 .tithi h1{font-size:44px;margin-top:6px}.tr2 .tithi h1 .dev{display:block;font-size:27px;margin:2px 0 0}
.tr2 .tithi p{font-size:14px;line-height:1.45}
.tr2 .arch{width:112px;height:138px;margin:0;border-radius:63px 63px 8px 8px}
.alm .capt{font-size:15px;margin-top:6px}.alm .idline{margin:-4px 4px 8px;font-size:11.5px}.alm .city{margin:2px 0 8px}.skysec{margin-top:14px}.skysec .shead{margin-bottom:10px}.skysec .h2{font-size:26px}.alm .fest{padding:6px 12px 6px 6px}.alm .fest img{width:38px;height:38px}
.alm .times{margin-top:12px}.alm .times>*{padding:8px 12px}.alm .fest{margin-top:8px}
/* night: quiet */
/* hit areas */
.dm .c .brand{padding:3px 0}
.top .brand{padding:7px 0}
.lang a{position:relative}.lang a:after{content:"";position:absolute;inset:-9px -4px}
a.h2{padding:6px 0}
/* search icon */
.ic.search svg{fill:none;stroke:var(--primary);stroke-width:2.4}
/* ================= DESKTOP (same sections as the phone) ================= */
.desk .sec,.desk .band{margin-top:0;padding-left:0;padding-right:0}
.desk .band{padding:26px 28px 28px;border-radius:24px}
.desk .planets,.desk .hs{padding:0}
.dbody{padding:0 64px}
.dpair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;margin-top:44px;align-items:start}
.dpair.wide{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.desk .planets{flex-wrap:wrap}.desk .planets .gr{flex:1 0 76px}
.desk .dhero2 .shead{padding:0!important}
.done1{margin-top:44px}
.desk .hs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-right:0!important}.desk .hs>*{width:auto}
.desk .tools{grid-template-columns:repeat(4,1fr)}
.desk .tool .pic{height:150px}
.desk .week{margin:0 0 18px!important}
.desk .chips{gap:10px}
.dhero2{display:grid;grid-template-columns:380px 300px minmax(0,1fr);gap:36px;padding:26px 64px 0}
.dhero2 .alm{margin:0;box-shadow:none;background:transparent;padding:0}
.dhero2 .alm .greet,.dhero2 .alm .idline,.dhero2 .alm .city,.dhero2 .tithi{text-align:left}
.dhero2 .alm .date{justify-content:flex-start}
.dhero2 .arch{width:300px;height:430px;border-radius:150px 150px 10px 10px;margin:6px 0 0;box-shadow:0 0 0 5px var(--bg),0 0 0 6.5px var(--gold)}
.dhero2 .idline{margin:0 0 10px}
.desk .help{margin:44px 0 0}
.desk .sitefoot{padding:30px 64px}
.desk .sitefoot .cols{grid-template-columns:repeat(4,1fr)}
.desk .dm nav a{padding:12px 0}
</style></head>
<body>
<div class="phone" id="phone"></div>
<div class="desk" id="desk"></div>
<script>
const MOONICON = '<svg viewBox="0 0 24 24"><path d="M14.5 2.5a9.5 9.5 0 1 0 7 15.9A8 8 0 0 1 14.5 2.5z"/></svg>';
const SEARCH = '<svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5l5 5" stroke-linecap="round"/></svg>';
const PLAY = '<span class="play"><svg viewBox="0 0 24 24"><path d="M6 3.5v17a1 1 0 0 0 1.5.9l13.5-8.5a1 1 0 0 0 0-1.8L7.5 2.6A1 1 0 0 0 6 3.5z"/></svg></span>';
const CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const wave = n => Array.from({length:n},(_,i)=>`<i class="${i<n/3?'on':''}" style="height:${30+Math.round(60*Math.abs(Math.sin(i*1.7)))}%"></i>`).join('');
const soon = '<span class="tag soon">OPENING SOON</span>';

/* 0 · header (phone) */
const header = () => `
  <div class="top">
    <a href="/" class="brand"><img src="img/seal.png" alt="">ASTRO RIVER</a>
    <div class="acts">
      <a class="ic search" href="/search" title="Find anything">${SEARCH}</a>
      <div class="lang"><span class="on">EN</span><a href="/hi/panchang" class="h">हिं</a></div>
      <span class="ic" title="Light / night">${MOONICON}</span>
    </div>
  </div>`;

/* 1 · the almanac (tiles change with the time of day) */
const tiles = () => `<div class="times">${T.tiles.map(t => `<a href="${t.href}" class="${t.c||''}"><div class="k">${t.k}</div><div class="v">${t.v}</div><div class="s">${t.s}</div></a>`).join('')}</div>`;
const fest = () => TOD === 'night' ? '' : `<a href="${DAY.fest.href}" class="fest"><img class="cover" src="img/karwa.jpg"><div><b>${DAY.fest.b}</b><span>${DAY.fest.s}</span></div></a>`;
const greetBlock = () => `
    <div class="greet"><span class="dev">${T.greetHi}</span>${T.greet}</div>
    <div class="date"><div class="n">${DAY.n}</div><div class="w">${DAY.wd}<span class="dev">${DAY.wdHi}</span><small>${DAY.month}</small></div></div>
    <div class="city">in <b>${DAY.city}</b> · change</div>
    <div class="idline">The Astro River Institute's almanac, consultations and pujas · Jalandhar · since 2008</div>`;
const tithiBlock = () => `<a href="/panchang" class="tithi"><div class="over">${T.tithiOver}</div><h1>${T.tithi}<span class="dev">${T.tithiHi}</span></h1><p>${T.tithiP}</p></a>`;
const arch = () => `<div class="arch"><img class="cover" src="${T.pic}" style="object-position:${T.picPos}" alt=""></div><div class="capt">${T.capt}</div>`;
const almanac = () => `<div class="alm">${greetBlock()}<div class="hair"></div><div class="tr2">${tithiBlock()}<div class="arch"><img class="cover" src="${T.pic}" style="object-position:${T.picPos}" alt=""></div></div><div class="capt" style="text-align:left">${T.capt}</div>${tiles()}${fest()}</div>`;

/* 2 · your sky today */
const C = MYCHART, tr = C.transit[TOD];
const ord = n => n + (n === 1 ? 'st' : n === 2 ? 'nd' : n === 3 ? 'rd' : 'th');
const skyRows = (ghost) => `<div class="skyrows">
    <${ghost?'div':'a href="/kundli"'}><div class="k">Your Moon</div><div><b>${C.moon} · ${C.nak}, pada ${C.pada}</b>${ghost?'':`<span>Your lagna is ${C.lagna}.</span>`}</div></${ghost?'div':'a'}>
    <${ghost?'div':'a href="/kundli"'}><div class="k">Your dasha</div><div><b>${C.md} – ${C.ad}</b><span>${C.md} Mahadasha until ${C.mdEnd} · ${C.ad} Antardasha until ${C.adEnd}</span></div></${ghost?'div':'a'}>
    <${ghost?'div':'a href="/planetary-positions"'}><div class="k">${TOD==='night'?'Tomorrow':'Today'}</div><div><b>The Moon ${TOD==='night'?'is in':'crosses'} your ${ord(tr[0])} house</b>${ghost?'':`<span>${tr[1]}</span>`}</div></${ghost?'div':'a'}>
  </div>`;
const sky = () => ME ? `
  <div class="sec skysec">
    <div class="shead"><div><div class="over">Your sky ${TOD==='night'?'tomorrow':'today'}</div><div class="h2" style="margin-top:6px">Moon in your ${ord(tr[0])} house</div></div><a href="/profile" class="more">Edit</a></div>
    <div class="card sky">${skyRows(false)}
      <a href="/sade-sati" class="flag">${C.sadeSati} →</a>
      <div class="row" style="margin:4px 0 10px"><a href="/kundli" class="more">Your full kundli →</a></div></div>
  </div>` : `
  <div class="sec skysec">
    <div class="over">Your sky today</div><div class="h2" style="margin-top:6px">Read every morning</div>
    <div class="card sky" style="margin-top:14px">
      <p style="margin-top:0;color:var(--text);font-size:15px">Tell us your birth date, time and place once. Every morning this page reads your chart.</p>
      <div class="row"><a href="/kundli" class="btn solid">Add my birth details</a></div>
      <div class="ghost" aria-hidden="true"><span class="tag soon">EXAMPLE</span><div class="gl">${skyRows(true)}</div></div>
      <div style="height:12px"></div></div>
  </div>`;

/* 3 · planets now */
const planets = () => `
  <div class="sec" style="margin-top:32px;padding:0">
    <div class="shead" style="padding:0 20px"><div><div class="over">Planets now</div><div class="sub" style="margin-top:6px">Jupiter enters Simha on Saturday. ℞ marks a graha moving backwards.</div></div><a href="/planetary-positions" class="more">All →</a></div>
    <a href="/planetary-positions" class="planets">${PLANETS.map(([n,s,r]) => `<div class="gr"><b>${n}</b><span>${s}${r?'<i>℞</i>':''}</span></div>`).join('')}</a>
  </div>`;

/* 4 · chips */
const chips = () => `
  <div class="sec" style="margin-top:34px">
    <div class="h2" style="font-size:27px">What would you like to do today?</div>
    <div class="chips" style="margin-top:14px">
      <span class="chip"><img class="cover" src="img/puja-thali.jpg">Today's ePooja<em>SOON</em></span>
      <a href="#remedy" class="chip"><img class="cover" src="img/mantra.jpg">Chant a mantra</a>
      <a href="/kundli" class="chip"><img class="cover" src="img/learn.jpg">${ME?'My kundli':'Make my kundli'}</a>
      <a href="/alchemies/diwali-lakshmi-puja-2026" class="chip"><img class="cover" src="img/lakshmi-lotus.jpg">Diwali puja</a>
      <span class="chip"><img class="cover" src="img/texts.jpg">Read the Gita<em>SOON</em></span>
      <a href="/alchemies" class="chip"><img class="cover" src="img/gems.jpg">Shop</a>
    </div>
  </div>`;

/* 5 · today's remedy (absorbs the mantra of the day) */
const remedy = () => `
  <div class="band saffron rem" id="remedy">
    <div class="over">${RM.over}</div>
    <div class="top2" style="margin-top:12px">
      <div class="pic"><img class="cover" src="${TOD==='evening'||TOD==='night'?'img/puja-thali.jpg':'img/mantra.jpg'}" alt=""></div>
      <div><h3>${RM.h}</h3><div class="prog">${RM.done} of 3 done ${TOD==='evening'||TOD==='night'?'this evening':'today'} · your ticks are kept until tomorrow's sunrise</div></div>
    </div>
    <div class="acts2">${RM.acts.map((a,i) => `<div class="act${i<RM.done?' done':''}"><span class="tick${i<RM.done?' on':''}" role="checkbox" aria-checked="${i<RM.done}">${i<RM.done?CHECK:''}</span><div style="flex:1;min-width:0"><b>${a.b.replace(/([ऀ-ॿ][ऀ-ॿ\s]*[ऀ-ॿ])/,'<span class="dev">$1</span>')}</b><span class="s">${a.s}</span>
        ${a.player?`<div class="player">${PLAY}<div class="wave">${wave(22)}</div><span class="count">× ${TOD==='evening'||TOD==='night'?'1':'108'}</span></div>`:''}</div></div>`).join('')}</div>
    ${ME ? `<a href="/remedies" class="bridge"><span><em>The Moon in your chart: in ${C.moon}, in your ${ord(C.moonHouse)} house.</em> The Chandra remedy →</span></a>`
         : `<a href="/remedies" class="bridge">Remedies for each graha →</a>`}
    ${TOD==='night'?`<div class="tmr">Tomorrow is Wednesday, kept for Ganesha: ॐ गं गणपतये नमः.</div>`:''}
  </div>`;

/* 6 · ePooja (opening soon, no button) */
const epooja = () => `
  <div class="sec">
    <div class="shead"><div><div class="over">Free · about 2 minutes</div><div class="h2" style="margin-top:6px">Today's ePooja</div></div></div>
    <div class="card feat">
      <div class="pic"><img class="cover" src="img/puja-thali.jpg"><span class="tag soon">OPENING SOON</span></div>
      <div class="body"><h3>Mangalvar Hanuman puja</h3>
        <p>A short guided puja for Tuesday: the diya, the sankalpa for today's tithi and nakshatra, Hanuman's mantra and the aarti.</p>
        <div class="soonline">Opening soon</div></div>
    </div>
  </div>`;

/* 7 · rashifal */
const SIGNS = [['Mesha','मेष','mesh'],['Vrishabha','वृषभ','vrishabh'],['Mithuna','मिथुन','mithun'],['Karka','कर्क','kark'],['Simha','सिंह','singh'],['Kanya','कन्या','kanya'],['Tula','तुला','tula'],['Vrischika','वृश्चिक','vrishchik'],['Dhanu','धनु','dhanu'],['Makara','मकर','makar'],['Kumbha','कुम्भ','kumbh'],['Meena','मीन','meen']];
const moonNow = TOD === 'night' ? 'Vrishabha' : 'Mesha';
const rashi = () => `
  <div class="sec">
    <div class="shead"><div><div class="over">Your rashifal</div>
      ${ME ? `<div class="h2" style="margin-top:6px">Kumbha, your Moon sign</div><div class="sub">Picked from your birth details. The Moon is in ${moonNow} ${TOD==='night'?'tonight':'today'}.</div>`
           : `<div class="h2" style="margin-top:6px">The Moon is in ${moonNow}</div><div class="sub">Pick your sign once; it is here every morning.</div>`}</div></div>
    <div class="signs">${SIGNS.map(([e,h,s]) => {
      const mine = ME && e === 'Kumbha', now = e === moonNow;
      const cls = ME ? (mine ? 'mine' : now ? 'now' : '') : (now ? 'moon' : '');
      return `<a href="/rashifal/${s}"><span class="${cls}" style="display:block">${e}<i>${h}</i>${mine?'<small>your Moon sign</small>':''}${ME&&now?'<small style="color:var(--gold-text)">Moon now</small>':''}</span></a>`; }).join('')}</div>
  </div>`;

/* 8 · this week + festival cards */
const week = () => `
  <div class="band lotus">
